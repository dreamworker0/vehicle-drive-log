name: CI 재검증 — PR base 재지정

# 스택 PR의 base를 master로 바꾸면 CI가 돌지 않아 검증 없이 방치되는 문제가 있었다
# (#92·#93이 생성 이래 한 번도 실행되지 않았다). base 변경은 synchronize가 아니라
# edited로 발화하기 때문이다.
#
# **왜 ci.yml에 edited를 넣지 않고 별도 파일로 뺐나**
# edited는 제목·본문 수정에도 발화한다. ci.yml에 edited를 두고 잡을 `if`로 걸러도,
# **잡이 건너뛰어지면 그 이름의 체크 런이 `skipped`로 생성된다.** 같은 커밋에서 앞선
# 실행이 실패해 있었다면 skipped가 그 위에 덮이고, 필수 체크는 skipped를 성공으로
# 취급한다 — 즉 **CI가 실패한 PR도 본문만 고치면 초록으로 보인다.**
#
# 여기서 건너뛰는 잡의 이름은 `revalidate` 하나뿐이고, 이 이름은 진짜 게이트가 한 번도
# 쓰지 않는다. 그래서 제목·본문 수정은 `ci`·`security-audit`·`changes`·`functions-tests`
# 어느 것도 건드리지 못한다. 덮어쓸 이름 자체가 없는 것이 이 분리의 요점이다.
#
# GITHUB_TOKEN으로 close/reopen이나 workflow_dispatch를 호출해 CI를 재발화시키는 방법은
# 쓸 수 없다 — 토큰이 일으킨 이벤트는 새 워크플로 실행을 만들지 않는다(PAT가 필요).
# workflow_call은 토큰 재발화가 아니라 같은 실행 안에서의 호출이라 이 제약을 받지 않는다.

on:
  pull_request:
    branches: [master]
    types: [edited]

permissions:
  contents: read

# ci.yml과 **다른 그룹**이어야 한다. 같은 그룹이면 잡을 건너뛰는 실행이
# cancel-in-progress로 진행 중인 진짜 CI를 죽인다(2026-08-02 PR #115에서 실제로 발생).
concurrency:
  group: ci-retarget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # base가 실제로 바뀐 edited만 통과한다. 제목·본문 수정은 여기서 skipped로 끝나고,
  # 그 결과는 `revalidate`라는 이름에만 남는다.
  #
  # 통과하면 ci.yml 전체를 호출한다. 체크 이름은 `revalidate / ci` 형태가 되어 평소의
  # `ci`와 구분된다 — 필수 체크가 이름으로 걸려 있다면 base 재지정 뒤에는 푸시를 한 번
  # 해야 머지할 수 있다. 초록으로 잘못 보이는 것보다 막히는 쪽이 안전하므로 그대로 둔다.
  revalidate:
    if: github.event.changes.base.ref.from != ''
    uses: ./.github/workflows/ci.yml
    secrets: inherit
