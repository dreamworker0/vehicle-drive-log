name: Deploy — 프로덕션 배포

# CI 성공이 배포의 하드 게이트다: master 푸시는 CI 워크플로가 전체 검증(lint·tsc·테스트·
# Rules·E2E·번들 예산)을 통과했을 때만 이 워크플로가 이어서 배포한다.
# workflow_dispatch는 긴급 수동 배포용 우회 경로(CI 미경유)로 유지.
on:
  workflow_run:
    workflows: ["CI — 린트 · 테스트 · 빌드"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# 최소 권한 — 배포는 Firebase 서비스 계정으로 수행하며 GITHUB_TOKEN으로 저장소에 쓰지 않는다.
permissions:
  contents: read

# 동시 배포 방지: 여러 푸시가 겹쳐도 한 번에 하나만 실행하고 나머지는 대기시킨다.
# (동일 Cloud Function을 동시에 업데이트하면 409 "unable to queue the operation"으로
#  일부 함수 갱신이 조용히 누락된다. cancel-in-progress:false로 진행 중 배포는 끝까지 보장.)
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run 트리거는 CI가 '성공'으로 끝났을 때만 배포 진행 (실패·취소 시 스킵)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: "Asia/Seoul"
      # 배포되는 커밋 SHA = Sentry 릴리즈 버전. 프런트(VITE_SENTRY_RELEASE)와
      # Functions(functions/.env의 SENTRY_RELEASE)가 **같은 값**을 써야 한 배포가
      # Sentry에서 하나의 릴리즈로 묶인다.
      SENTRY_RELEASE_VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      # CI가 검증한 바로 그 커밋을 배포한다 (workflow_run 사이에 새 푸시가 끼어도 안전)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: cd functions && npm ci --legacy-peer-deps

      - name: Create .env files
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          # Secret Manager(defineSecret)로 관리하는 키는 functions/.env에서 걸러낸다 —
          # 같은 이름이 .env에 있으면 Firebase가 이름 충돌로 배포를 거부한다.
          # 목록은 params.ts의 export 선언에서 뽑아 단일 원본을 유지한다: 새 키를 시크릿으로 옮길 때
          # GitHub Secret(FUNCTIONS_ENV_FILE)의 옛 줄을 지우는 것을 잊어도 배포가 서지 않는다.
          SECRET_KEYS=$(grep -oE '^export const [A-Z0-9_]+ = defineSecret\("[A-Z0-9_]+"\)' functions/src/core/params.ts | grep -oE '\("[A-Z0-9_]+"\)' | tr -d '(")' | paste -sd'|' -)
          if [ -z "$SECRET_KEYS" ]; then
            echo "::error::params.ts에서 defineSecret 키를 찾지 못했다 — 필터가 비면 이름 충돌을 놓친다"
            exit 1
          fi
          echo "${{ secrets.FUNCTIONS_ENV_FILE }}" | grep -vE "^(${SECRET_KEYS})=" > functions/.env || true
          # Functions 런타임에 릴리즈를 알린다 (functions/src/core/sentry.ts가 읽는다).
          # 시크릿 파일에 넣지 않고 여기서 덧붙이는 이유: 값이 배포마다 달라진다.
          echo "SENTRY_RELEASE=${SENTRY_RELEASE_VERSION}" >> functions/.env

      - name: Build
        env:
          # 프런트 번들에 릴리즈를 새긴다. Vite는 VITE_ 접두사 process.env를 .env보다
          # 우선해 읽으므로 secrets.ENV_FILE을 건드리지 않고 주입된다.
          VITE_SENTRY_RELEASE: ${{ env.SENTRY_RELEASE_VERSION }}
          # 소스맵(hidden) 생성 — Sentry 업로드용. Hosting에는 나가지 않는다(firebase.json ignore).
          SENTRY_SOURCEMAPS: "1"
        run: npm run build

      # CI 성공이 하드 게이트이므로 CI 경유(workflow_run) 배포에선 중복 검증을 생략한다 (~1.5분 절감).
      # workflow_dispatch(긴급 수동 배포, CI 미경유)일 때만 최소 안전망으로 실행.
      - name: Unit tests (긴급 우회 경로만)
        if: github.event_name == 'workflow_dispatch'
        run: npx vitest run

      - name: Security audit (긴급 우회 경로만)
        if: github.event_name == 'workflow_dispatch'
        run: npm run audit

      # 함수/규칙을 Hosting보다 먼저 배포한다.
      # (Hosting 릴리즈가 불안정 네트워크로 오탐 실패해도 핵심 백엔드 변경은 항상 반영되도록)
      # storage 규칙도 포함한다 — 기관 증빙서류(PII) 접근 규칙이 storage.rules에 있는데
      # 과거 타겟에 storage가 빠져 있어 storage.rules 변경이 배포되지 않던 갭을 닫는다.
      # (2026-07-18 보안 재점검 B 후속 — 규칙 변경이 프로덕션에 실제 반영되도록)
      - name: Deploy Functions & Rules
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$(mktemp)
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only functions,firestore:rules,storage --force --project vehicle-drive-log
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      # 인덱스는 **Hosting보다 먼저** 배포한다. 복합 쿼리를 쓰는 새 화면이 먼저 나가면
      # 인덱스가 생기기 전까지 그 쿼리가 failed-precondition으로 거부된다
      # (Phase 139 접속기록 조회 화면에서 실제로 발생 — 화면은 나갔는데 인덱스가 없었다).
      #
      # ⚠️ `--force`를 **일부러 붙이지 않는다.** 위 Functions/Rules 스텝과 분리한 이유가 이것이다.
      # firebase-tools는 `firestore.indexes.json`에 없는 기존 인덱스를 삭제할지 물어보고,
      # `--force`는 그 질문에 "예"로 답한다 — 콘솔에서 손으로 만든 인덱스가 조용히 지워질 수 있다.
      # 비대화형(CI, stdin이 TTY 아님)에서 `--force` 없이 실행하면 firebase-tools는
      # 삭제 대상을 안내만 하고 기본값 '아니오'로 넘어가며(prompt.guard의 default: false),
      # **없는 인덱스 생성은 그대로 수행하고 배포도 중단되지 않는다**(v15.25.1 lib/firestore/api.js 확인).
      # 즉 이 스텝은 '추가만' 한다. 파일에서 인덱스를 지웠을 때 프로덕션에서도 지우려면
      # 로컬에서 목록을 확인한 뒤 수동으로 `--force`를 붙여 실행한다.
      - name: Deploy Firestore Indexes
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$(mktemp)
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only firestore:indexes --non-interactive --project vehicle-drive-log
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      # Hosting은 firebase-tools CLI로 직접 배포한다.
      # action-hosting-deploy는 실패 시 --debug로 재시도하며 functions/.env 시크릿을
      # 로그에 평문 출력하는 문제가 있어 사용하지 않는다. (--debug 미사용 = 누출 없음)
      - name: Deploy Hosting
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$(mktemp)
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          set +e
          OUT=$(npx firebase-tools deploy --only hosting --force --project vehicle-drive-log 2>&1)
          CODE=$?
          echo "$OUT"
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          # 불안정 네트워크로 릴리즈 POST를 재시도할 때 첫 호출이 이미 성공해
          # "is the current active version" 400이 나는 알려진 오탐은 성공으로 간주한다.
          if [ $CODE -ne 0 ] && echo "$OUT" | grep -q "is the current active version"; then
            echo "::warning::Hosting 릴리즈가 'current active version' 응답 — 이미 라이브 반영됨으로 간주하고 통과 처리"
            exit 0
          fi
          exit $CODE

      # 토큰 유무를 **스텝 안에서** 판정한다. 잡 레벨 env에 두면 시크릿이 없는 것과
      # **빈 값으로 등록된 것**이 똑같이 조용한 skip으로 끝나고, 배포는 초록이라
      # 소스맵이 몇 번이나 누락된 뒤에야 발견된다(2026-08-30~31 배포 4건에서 실제로 발생).
      # 스텝 env로 받는 시크릿은 값이 확실히 실리는 자리이므로 판정도 여기서 한다.
      #
      # 앞 스텝(배포)이 실패하면 이 스텝부터 실행되지 않아 outputs가 비고, 이어지는
      # Sentry 스텝도 자동으로 건너뛴다 — "성공한 배포만 릴리즈로 남긴다"가 유지된다.
      - name: Sentry 릴리즈 게이트 판정
        id: sentry_gate
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Sentry 릴리즈 건너뜀::SENTRY_AUTH_TOKEN이 비어 있거나 없습니다 — 릴리즈 태깅은 이벤트로 자동 생성되지만 소스맵·커밋 연결이 빠집니다. 저장소 Settings → Secrets and variables → Actions에서 값을 확인하세요."
          fi

      # 배포가 **성공한 뒤에만** Sentry에 릴리즈를 남긴다. 실패한 배포까지 릴리즈로 잡히면
      # "이 릴리즈부터 고쳐졌다"는 판단(Resolved in next release)이 어긋난다.
      #
      # 이 스텝이 없으면(=토큰 미설정) 이벤트에 실린 release 값으로 Sentry가 릴리즈를
      # 자동 생성하므로 "다음 릴리즈에서 해결" 자체는 동작한다. 여기서 더 얻는 것은
      # **소스맵(원본 코드 스택트레이스)**과 **커밋 연결(누가 어떤 변경으로 냈는지)**이다.
      - name: Sentry 릴리즈 등록 (소스맵·커밋 연결)
        if: steps.sentry_gate.outputs.enabled == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'socialprism' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'javascript-react' }}
          # Functions가 다른 Sentry 프로젝트로 보고한다면 저장소 변수로 지정한다(선택).
          SENTRY_PROJECT_FUNCTIONS: ${{ vars.SENTRY_PROJECT_FUNCTIONS }}
        run: |
          set -e
          VERSION="$SENTRY_RELEASE_VERSION"
          CLI="npx --yes @sentry/cli@2"
          PROJECTS="-p $SENTRY_PROJECT"
          if [ -n "$SENTRY_PROJECT_FUNCTIONS" ]; then
            PROJECTS="$PROJECTS -p $SENTRY_PROJECT_FUNCTIONS"
          fi

          $CLI releases new "$VERSION" $PROJECTS

          # 커밋 연결은 Sentry의 GitHub 연동이 있어야 한다. 없으면 실패하지만 릴리즈 자체는
          # 이미 만들어졌으므로 배포를 실패시키지 않는다(경고만 남긴다).
          $CLI releases set-commits "$VERSION" --auto --ignore-missing \
            || echo "::warning::Sentry 커밋 연결 실패 — GitHub 연동이 없어도 릴리즈·소스맵은 정상 등록됩니다"

          # 번들 URL은 https://<host>/assets/*.js 이므로 아티팩트 이름을 ~/assets/*로 맞춘다.
          $CLI sourcemaps upload --release "$VERSION" --url-prefix '~/assets' dist/assets

          $CLI releases finalize "$VERSION"
          $CLI deploys new -r "$VERSION" -e production
