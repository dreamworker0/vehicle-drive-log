name: Deploy — 프로덕션 배포

# CI 성공이 배포의 하드 게이트다: master 푸시는 CI 워크플로가 전체 검증(lint·tsc·테스트·
# Rules·E2E·번들 예산)을 통과했을 때만 이 워크플로가 이어서 배포한다.
# workflow_dispatch는 긴급 수동 배포용 우회 경로(CI 미경유)로 유지.
on:
  workflow_run:
    workflows: ["CI — 린트 · 테스트 · 빌드"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# 최소 권한 — 배포는 Firebase 서비스 계정으로 수행하며 GITHUB_TOKEN으로 저장소에 쓰지 않는다.
permissions:
  contents: read

# 동시 배포 방지: 여러 푸시가 겹쳐도 한 번에 하나만 실행하고 나머지는 대기시킨다.
# (동일 Cloud Function을 동시에 업데이트하면 409 "unable to queue the operation"으로
#  일부 함수 갱신이 조용히 누락된다. cancel-in-progress:false로 진행 중 배포는 끝까지 보장.)
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run 트리거는 CI가 '성공'으로 끝났을 때만 배포 진행 (실패·취소 시 스킵)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: "Asia/Seoul"

    steps:
      # CI가 검증한 바로 그 커밋을 배포한다 (workflow_run 사이에 새 푸시가 끼어도 안전)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: cd functions && npm ci --legacy-peer-deps

      - name: Create .env files
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          echo "${{ secrets.FUNCTIONS_ENV_FILE }}" > functions/.env

      - name: Build
        run: npm run build

      # CI 성공이 하드 게이트이므로 CI 경유(workflow_run) 배포에선 중복 검증을 생략한다 (~1.5분 절감).
      # workflow_dispatch(긴급 수동 배포, CI 미경유)일 때만 최소 안전망으로 실행.
      - name: Unit tests (긴급 우회 경로만)
        if: github.event_name == 'workflow_dispatch'
        run: npx vitest run

      - name: Security audit (긴급 우회 경로만)
        if: github.event_name == 'workflow_dispatch'
        run: npm run audit

      # 함수/규칙을 Hosting보다 먼저 배포한다.
      # (Hosting 릴리즈가 불안정 네트워크로 오탐 실패해도 핵심 백엔드 변경은 항상 반영되도록)
      # storage 규칙도 포함한다 — 기관 증빙서류(PII) 접근 규칙이 storage.rules에 있는데
      # 과거 타겟에 storage가 빠져 있어 storage.rules 변경이 배포되지 않던 갭을 닫는다.
      # (2026-07-18 보안 재점검 B 후속 — 규칙 변경이 프로덕션에 실제 반영되도록)
      - name: Deploy Functions & Rules
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$(mktemp)
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only functions,firestore:rules,storage --force --project vehicle-drive-log
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      # 인덱스는 **Hosting보다 먼저** 배포한다. 복합 쿼리를 쓰는 새 화면이 먼저 나가면
      # 인덱스가 생기기 전까지 그 쿼리가 failed-precondition으로 거부된다
      # (Phase 139 접속기록 조회 화면에서 실제로 발생 — 화면은 나갔는데 인덱스가 없었다).
      #
      # ⚠️ `--force`를 **일부러 붙이지 않는다.** 위 Functions/Rules 스텝과 분리한 이유가 이것이다.
      # firebase-tools는 `firestore.indexes.json`에 없는 기존 인덱스를 삭제할지 물어보고,
      # `--force`는 그 질문에 "예"로 답한다 — 콘솔에서 손으로 만든 인덱스가 조용히 지워질 수 있다.
      # 비대화형(CI, stdin이 TTY 아님)에서 `--force` 없이 실행하면 firebase-tools는
      # 삭제 대상을 안내만 하고 기본값 '아니오'로 넘어가며(prompt.guard의 default: false),
      # **없는 인덱스 생성은 그대로 수행하고 배포도 중단되지 않는다**(v15.25.1 lib/firestore/api.js 확인).
      # 즉 이 스텝은 '추가만' 한다. 파일에서 인덱스를 지웠을 때 프로덕션에서도 지우려면
      # 로컬에서 목록을 확인한 뒤 수동으로 `--force`를 붙여 실행한다.
      - name: Deploy Firestore Indexes
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$(mktemp)
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only firestore:indexes --non-interactive --project vehicle-drive-log
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      # Hosting은 firebase-tools CLI로 직접 배포한다.
      # action-hosting-deploy는 실패 시 --debug로 재시도하며 functions/.env 시크릿을
      # 로그에 평문 출력하는 문제가 있어 사용하지 않는다. (--debug 미사용 = 누출 없음)
      - name: Deploy Hosting
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$(mktemp)
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          set +e
          OUT=$(npx firebase-tools deploy --only hosting --force --project vehicle-drive-log 2>&1)
          CODE=$?
          echo "$OUT"
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          # 불안정 네트워크로 릴리즈 POST를 재시도할 때 첫 호출이 이미 성공해
          # "is the current active version" 400이 나는 알려진 오탐은 성공으로 간주한다.
          if [ $CODE -ne 0 ] && echo "$OUT" | grep -q "is the current active version"; then
            echo "::warning::Hosting 릴리즈가 'current active version' 응답 — 이미 라이브 반영됨으로 간주하고 통과 처리"
            exit 0
          fi
          exit $CODE
