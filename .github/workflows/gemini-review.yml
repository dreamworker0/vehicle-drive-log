name: Gemini 리뷰 — PR 자동 코드 리뷰

# **`pull_request`가 아니라 `pull_request_target`인 이유**: GitHub는 Dependabot이 연 PR과
# 포크 PR에 시크릿을 주지 않는다. `pull_request`로 두면 정작 매주 쌓이는 의존성 PR에서
# 리뷰가 조용히 아무것도 하지 않는다(실패도 아니라 알아채기 어렵다).
#
# `pull_request_target`은 base 브랜치 컨텍스트에서 돌아 시크릿에 접근하지만, 그래서
# **PR head 코드를 절대 실행해서는 안 된다**. 이 워크플로는 그 조건을 지킨다 —
# 체크아웃에 ref를 주지 않아 base(신뢰된 코드)만 받고, PR 내용은 API로 받은 diff 텍스트로만
# 다룬다. 빌드·설치·테스트를 돌리지 않으므로 PR 코드가 실행될 경로가 없다.
on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened]
    # 문서 전용 PR은 리뷰하지 않는다(CI와 같은 기준 — 호출 비용 절약).
    paths-ignore:
      - 'docs/**'
      - '**.md'

# 최소 권한 — diff를 읽고 코멘트를 남기는 것 외에 아무 것도 하지 않는다.
permissions:
  contents: read
  pull-requests: write

# 연속 푸시가 겹치면 낡은 리뷰를 취소한다. 코멘트는 갈아쓰기 방식이라 마지막 것만 남는다.
concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # ref 미지정 = base 브랜치. PR head를 받지 않는 것이 이 워크플로의 안전 조건이다.
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 의존성 설치가 없다 — 스크립트는 Node 22의 TS 타입 스트리핑과 내장 fetch만 쓴다.
      # (`npm ci`를 넣으면 리뷰 한 번에 20초 이상이 더 붙는다. Actions 분량을 아끼는 쪽을 택했다.)
      - name: Gemini 리뷰 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/gemini-pr-review.ts
