name: CI — 린트 · 테스트 · 빌드

on:
  push:
    branches: [master]
    # 문서·마크다운만 변경된 푸시는 CI(및 이어지는 Deploy)를 건너뛴다 — Actions 무료 분량 절약.
    # 1회 풀 사이클 ≈ 20분(CI ~16분 + Deploy ~4분)이라 문서 전용 푸시가 누적 비용의 주범이었다.
    # 코드와 섞인 푸시는 정상 실행되고, .md 전용 변경의 sync --check는 다음 코드 푸시에서 검증된다.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [master]
    # 기본 타입(opened·synchronize·reopened)에 edited를 더한다 — 스택 PR의 base를 master로
    # 바꿔도 CI가 돌지 않아 검증 없이 방치되는 문제가 있었다(#92·#93이 생성 이래 한 번도 실행 안 됨).
    # base 변경은 synchronize가 아니라 edited로 발화하기 때문이다.
    types: [opened, synchronize, reopened, edited]

# 최소 권한 — CI는 코드 체크아웃만 필요하고 저장소에 쓰지 않는다.
permissions:
  contents: read

# 연속 푸시가 겹치면 낡은 CI를 취소한다 — 마지막 푸시만 검증·배포된다.
# (취소된 CI는 conclusion이 success가 아니므로 Deploy(workflow_run)로 이어지지 않아 안전)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 변경 경로 감지 — Functions 단위 테스트(~11분)는 관련 경로 변경 시에만 실행한다.
  # shared/**는 Functions에서도 소비(shared/faqData.ts → functions/src/utils/faqData.ts)하므로
  # 반드시 포함한다. 워크플로 자체 변경 시에는 안전하게 전체 실행.
  changes:
    # edited는 제목·본문 수정에도 발화한다. 그때마다 전체 CI(~16분)를 돌리면 Actions 분량이 샌다.
    # base가 실제로 바뀐 edited만 통과시킨다. push·opened·synchronize·reopened는 action이
    # 'edited'가 아니므로 항상 통과한다. (changes가 스킵되면 functions-tests도 needs로 함께 스킵)
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - uses: actions/checkout@v7
      - name: 변경 경로 감지
        id: filter
        # 서드파티 액션은 커밋 SHA로 고정한다 — 태그는 이동 가능하므로 공급망 변조(태그 재지정) 방어.
        # 공식 actions/*는 GitHub 관리(+Dependabot)라 메이저 태그를 유지한다. (2026-07-18 보안 재점검 G)
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            functions:
              - 'functions/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'

  # 보안 감사 — **독립 잡**이며 npm ci에 의존하지 않는다.
  #
  # 원래 ci 잡의 마지막 스텝이었는데, 그 자리는 감사가 가장 필요한 상황에서 정확히
  # 실행되지 않는 자리였다. 의존성 PR에서 앞 스텝이 깨지면(#85 npm ci ERESOLVE,
  # #86 vite 8 빌드 실패) 뒤따르는 스텝이 전부 skipped가 되어 감사도 함께 건너뛰어졌고,
  # 체크는 "설치 실패"로만 표시돼 **감사가 돌지 않았다는 사실 자체가 어디에도 남지 않았다**.
  # 의존성을 올리는 PR이야말로 감사가 필요한 자리이므로 이 결합을 끊는다.
  #
  # npm ci를 하지 않는 이유: `npm audit`은 package-lock.json만으로 동작하고
  # scripts/security-audit.ts는 Node 내장 모듈만 쓴다. 설치가 깨지는 PR에서도 감사는
  # 돌아야 하므로 설치 단계를 아예 두지 않는다(Node 22의 네이티브 TS 실행 사용).
  security-audit:
    # changes 잡과 같은 가드 — PR 제목·본문 수정(edited)만으로 감사를 다시 돌리지 않는다.
    # base가 실제로 바뀐 edited와 push·opened·synchronize·reopened는 통과한다.
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: "Asia/Seoul"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # tsx·devDependencies 설치 없이 실행한다 — 설치 실패가 감사를 막지 않게 하려는 것이 요점이다.
      - name: Security audit (root + functions)
        run: node --experimental-strip-types scripts/security-audit.ts

  # Functions 단위 테스트(pass/fail 게이트) — 메인 ci 잡과 병렬 실행해 전체 체감 시간을 줄인다.
  # 커버리지 계측은 이 러너에서 실행 시간을 +15분(11분→26분) 늘리는데 워커 수로는 못 줄여서
  # (병목=계측 자체), per-push에서는 커버리지 없이 빠르게 pass/fail만 본다. 커버리지 회귀 게이트는
  # 별도 스케줄 워크플로(functions-coverage.yml)가 주 1회 자동 검사한다.
  functions-tests:
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: "Asia/Seoul"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Functions unit tests
        run: cd functions && npx jest --testPathIgnorePatterns=emulator --maxWorkers=2 --workerIdleMemoryLimit=512MB
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  ci:
    # changes 잡과 동일한 가드 — 제목·본문만 고친 edited로는 돌지 않는다.
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != ''
    runs-on: ubuntu-latest
    # 게이트 스텝(Rules·인증 E2E·커버리지) 추가로 첫 실행(캐시 미적중) 기준 ~20분 소요
    timeout-minutes: 25
    env:
      TZ: "Asia/Seoul"

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Type check (functions)
        run: npm run type-check:functions

      - name: .agent ↔ .claude 동기화 검증
        run: npm run sync:agents -- --check

      - name: 하네스 Doctor (정합성 검사)
        run: npm run verify:harness

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Build
        run: npm run build

      # --coverage로 vitest.config.js의 커버리지 임계치를 실제 게이트로 강제한다
      - name: Unit tests (+coverage gate)
        run: npx vitest run --coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14

      # ── Firestore Rules 테스트 (멀티테넌트 격리의 유일한 자동 검증) ──
      # firebase-tools 15.x는 Java 21 미만을 지원하지 않는다 (17이면 에뮬레이터 기동 실패)
      - name: Setup Java (Firebase emulator)
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Security Rules tests (Firestore + Storage emulator)
        run: npx firebase-tools emulators:exec --only firestore,storage "npx vitest run tests/firestore-rules.test.ts tests/storage-rules.test.ts"

      # ── E2E ──
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test
        env:
          CI: true

      # 인증 E2E — 에뮬레이터(auth,firestore) 위에서 로그인·역할 리다이렉트·오프라인 동기화 검증
      - name: Authed E2E (emulator)
        run: npx firebase-tools emulators:exec --only auth,firestore "npx playwright test -c playwright.emulator.config.ts"
        env:
          CI: true

      - name: Bundle size check
        run: npx tsx scripts/check-bundle-size.ts

      # 실패 진단용 아티팩트 — E2E trace·screenshot·test-results. 성공 시에는 업로드하지 않는다.
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
