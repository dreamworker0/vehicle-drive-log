version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # 아래 메이저는 업스트림·설정 제약으로 지금 올릴 수 없다. 열어 두면 매주 같은 PR이
    # 되살아나 CI를 빨간 상태로 점유하고, 실패가 일상이 되면 진짜 실패를 못 알아본다.
    # **차단은 영구가 아니라 재검토 조건이 붙은 보류다** — 조건이 충족되면 항목을 지운다.
    ignore:
      # eslint 10: eslint-plugin-jsx-a11y@6.10.2의 peer가 `^3 || ... || ^9`로 9에서 막혀
      # npm ci가 ERESOLVE로 실패한다(PR #85). --legacy-peer-deps로 우회하면 lockfile 신뢰도가
      # 떨어지므로 선택하지 않는다.
      # 재검토: eslint-plugin-jsx-a11y가 eslint 10을 peer에 넣으면 이 항목 제거.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # vite 8: 번들러가 Rollup → Rolldown으로 바뀌어 `manualChunks` 객체 형식을 받지 않는다
      # (PR #86, `TypeError: manualChunks is not a function`). vite.config의 청크 전략을
      # 함수형 또는 advancedChunks로 재작성해야 하는 마이그레이션 작업이다.
      # 재검토: 청크 전략 재작성을 별건으로 처리한 뒤 이 항목 제거.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6: vite 8을 peer로 요구해 위 항목과 한 묶음이다(PR #88).
      # 재검토: vite 8 마이그레이션과 함께 해제.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # typescript 7(네이티브 포트): 린터가 아예 뜨지 않는다 — typescript-eslint가 import
      # 시점에 `Error: typescript-eslint does not support TS 7.0`을 던져 `npm run lint`가
      # 즉시 죽는다(PR #157, 2026-08-05 실측). 규칙 하나를 끄는 문제가 아니라 업스트림 차단이다.
      # 부수적으로 tsconfig 마이그레이션도 필요하다 — TS 7이 `baseUrl`을 제거(TS5102)하고
      # 비상대 `paths`를 금지(TS5090)하므로 `"@/*": ["src/*"]`를 `["./src/*"]`로 바꿔야 한다.
      # 재검토: typescript-eslint가 TS 7을 지원하면 tsconfig 정리와 함께 해제(functions 쪽도 같이).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - functions
    # 루트와 같은 이유로 minor/patch를 한 PR로 묶는다. 개별 PR로 열리면 셋 다
    # functions/package-lock.json을 건드려, 하나를 머지하는 순간 나머지가 충돌하고
    # 리베이스 후 CI 재실행이 필요하다(2026-09-02 PR #260·#261·#262에서 실측).
    groups:
      functions-minor-and-patch:
        update-types:
          - minor
          - patch
    # ⚠️ 메이저 상향의 peer 커플링 두 가지 (2026-09-06 Phase 216에서 확인)
    #   (1) firebase-admin 15가 나오면 **단독 PR은 다시 ERESOLVE로 죽는다** —
    #       firebase-functions 7의 peer가 `^11 || ^12 || ^13 || ^14`이기 때문이다.
    #       admin 13→14 때와 같이 functions와 **함께** 올려야 한다(PR #116·#342).
    #   (2) @babel/core와 @babel/preset-env는 8 메이저에서 **한 묶음**이다.
    #       preset-env 7의 peer는 `@babel/core ^7`만 받으므로, 둘이 각각 별도 PR로
    #       올라오면 서로의 peer를 깨서 둘 다 npm ci가 실패한다. 함께 올릴 것.
    #       (이 두 패키지는 jose ESM을 Jest에서 변환하려고 들인 것이다 — Phase 216)
    ignore:
      # typescript 7: 루트와 같은 이유로 보류한다(PR #151). 루트 `npm run lint`가 functions까지
      # 커버하므로 두 디렉터리의 typescript 버전이 갈라지면 린트 대상과 컴파일러가 어긋난다.
      # 재검토: 루트 typescript 항목과 **함께** 제거한다.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # GitHub Actions 버전 갱신. 액션이 오래되면 러너의 Node 지원 종료(예: Node 20 → 24
  # 강제 실행 경고)로 언젠가 CI 전체가 깨진다. minor/patch는 묶어 노이즈를 줄이고,
  # 실제로 중요한 메이저 상향(v4 → v5 등)은 개별 PR로 올라온다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
